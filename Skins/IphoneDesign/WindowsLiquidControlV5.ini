[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
BackgroundMode=2
SolidColor=0,0,0,1
Draggable=1
KeepOnScreen=1
SnapEdges=1

[Metadata]
Name=Windows Liquid Control V5
Author=OpenAI
Information=Compact top-right liquid glass control center with corrected Rainmeter geometry.
Version=5.0

[Variables]
PanelW=430
PanelH=760
Glass=10,15,24,98
Card=30,38,52,118
Card2=44,52,68,138
Edge=255,255,255,45
Text=246,248,252,255
Sub=190,200,215,220
Blue=44,156,255,235
Red=244,72,82,230
WhiteFill=242,245,249,218

[Panel]
Meter=Shape
Shape=Rectangle 0,0,#PanelW#,#PanelH#,30 | Fill Color #Glass# | StrokeWidth 1 | Stroke Color #Edge#

[Inner]
Meter=Shape
Shape=Rectangle 4,4,422,752,27 | Fill Color 0,0,0,1 | StrokeWidth 1 | Stroke Color 255,255,255,16

; HEADER -------------------------------------------------------
[MeasureTime]
Measure=Time
Format=%H:%M
[MeasureDate]
Measure=Time
Format=%A, %d %B
[MeasureBattery]
Measure=Plugin
Plugin=PowerPlugin
PowerState=Percent
UpdateDivider=30

[Title]
Meter=String
Text=WINDOWS CONTROL
FontFace=Segoe UI Semibold
FontSize=15
FontColor=#Text#
AntiAlias=1
X=20
Y=16

[Time]
Meter=String
MeasureName=MeasureTime
FontFace=Segoe UI Semibold
FontSize=15
FontColor=#Text#
StringAlign=Right
AntiAlias=1
X=408
Y=16

[Date]
Meter=String
MeasureName=MeasureDate
FontFace=Segoe UI
FontSize=8
FontColor=#Sub#
AntiAlias=1
X=20
Y=40

[Battery]
Meter=String
Text=[MeasureBattery]%% battery
DynamicVariables=1
FontFace=Segoe UI
FontSize=8
FontColor=#Sub#
StringAlign=Right
AntiAlias=1
X=408
Y=40

