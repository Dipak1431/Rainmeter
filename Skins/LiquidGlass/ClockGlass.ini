[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
BackgroundMode=2
SolidColor=0,0,0,1
[Variables]
Text=240,247,255,255
Sub=184,204,224,235
Glass=10,18,34,138
Edge=110,235,255,72
[MeterBG]
Meter=Shape
Shape=Rectangle 0,0,330,150,26 | Fill Color #Glass# | StrokeWidth 1 | Stroke Color #Edge#
[MeasureTime]
Measure=Time
Format=%H:%M
[MeasureDate]
Measure=Time
Format=%A, %d %b %Y
[MeterTime]
Meter=String
MeasureName=MeasureTime
FontFace=Segoe UI Semibold
FontSize=34
FontColor=#Text#
X=20
Y=34
AntiAlias=1
[MeterDate]
Meter=String
MeasureName=MeasureDate
FontFace=Segoe UI
FontSize=12
FontColor=#Sub#
X=22
Y=82
AntiAlias=1
[MeterLine]
Meter=Shape
Shape=Line 20,114,140,114 | StrokeWidth 2 | Stroke Color 96,232,255,160
