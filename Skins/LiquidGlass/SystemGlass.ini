[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
BackgroundMode=2
SolidColor=0,0,0,1
[Variables]
Text=240,247,255,255
Sub=184,204,224,235
Glass=10,18,34,138
Edge=110,235,255,72
Accent=96,232,255,255

[MeterBG]
Meter=Shape
Shape=Rectangle 0,0,280,190,26 | Fill Color #Glass# | StrokeWidth 1 | Stroke Color #Edge#
[MeterTitle]
Meter=String
Text=SYSTEM STATUS
FontFace=Segoe UI Semibold
FontSize=14
FontColor=#Text#
X=20
Y=18
AntiAlias=1
[MeasureCPU]
Measure=CPU
[MeasureRAM]
Measure=PhysicalMemory
[MeasureUptime]
Measure=Uptime
Format=%4!i!h %3!i!m
[MeterCPU]
Meter=String
MeasureName=MeasureCPU
Text=CPU  %1%%
FontFace=Segoe UI Semibold
FontSize=24
FontColor=#Text#
X=22
Y=52
AntiAlias=1
[MeterRAM]
Meter=String
MeasureName=MeasureRAM
Text=RAM  %1%%
Percentual=1
FontFace=Segoe UI Semibold
FontSize=24
FontColor=#Text#
X=22
Y=90
AntiAlias=1
[MeterUp]
Meter=String
MeasureName=MeasureUptime
Text=UPTIME  %1
FontFace=Segoe UI
FontSize=12
FontColor=#Sub#
X=22
Y=134
AntiAlias=1
